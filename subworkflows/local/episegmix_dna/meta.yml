# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "episegmix_dna"
description: Executes the EpiSegMix DNA methylation-specific hidden Markov model pipeline, sequentially training the model, decoding the genomic segmentation using specific region constraints, and generating evaluation reports.
keywords:
  - epigenomics
  - dna methylation
  - segmentation
  - hidden markov model
  - training
  - decoding
  - reporting
components:
  - episegmix/dnatrain
  - episegmix/dnadecode
  - episegmix/dnareport
input:
  - ch_train_counts:
      type: file
      description: |
        The input channel containing prepared training counts, configuration YAML, and sample metadata.
        Structure: `[ val(sample_id), val(meta), path(histone), val(meta2), path(meth), val(state), path(yaml), path(traincounts), path(trainregions), path(traincountsmeth) ]`
      pattern: "*"
  - ch_train_region:
      type: file
      description: |
        The input channel containing the specific regions file required for DNA model decoding.
        Structure: `[ val(sample_id), path(region) ]`
      pattern: "*.regions.txt"
output:
  - ch_segmentation:
      type: file
      description: |
        Channel containing the final segmented output directory, passed forward with all preceding metadata and files.
        Structure: `[ val(sample_id), val(meta), path(histone), val(meta2), path(meth), val(state), path(yaml), path(traincounts), path(trainregions), path(traincountsmeth), path(json), path("Segmentation") ]`
      pattern: "Segmentation"
  - ch_dnatrain_json:
      type: file
      description: |
        Channel containing the trained DNA model JSON file generated by the training step.
        Structure: `[ val(sample_id), val(meta), path(histone), val(meta2), path(meth), val(state), path(yaml), path(traincounts), path(trainregions), path(traincountsmeth), path("final*.json") ]`
      pattern: "final*.json"
authors:
  - "@aaryanjaitly"
maintainers:
  - "@aaryanjaitly"
