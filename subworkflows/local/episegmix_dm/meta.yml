# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "episegmix_dm"
description: Executes the standard EpiSegMix (DM) hidden Markov model pipeline, sequentially training the model, decoding the genomic segmentation, and generating evaluation reports.
keywords:
  - epigenomics
  - segmentation
  - hidden markov model
  - dm
  - training
  - decoding
  - reporting
components:
  - episegmix/dmtrain
  - episegmix/dmdecode
  - episegmix/dmreport
input:
  - ch_train_counts:
      type: file
      description: |
        The input channel containing prepared training counts, regions, configuration YAML, and sample metadata.
        Structure: `[ val(sample_id), val(meta), path(histone), val(meta2), path(meth), val(state), path(yaml), path(traincounts), path(trainregions), path(traincountsmeth) ]`
      pattern: "*"
output:
  - ch_segmentation:
      type: file
      description: |
        Channel containing the final segmented output directory, passed forward with all preceding metadata and files.
        Structure: `[ val(sample_id), val(meta), path(histone), val(meta2), path(meth), val(state), path(yaml), path(traincounts), path(trainregions), path(traincountsmeth), path(json), path("Segmentation") ]`
      pattern: "Segmentation"
  - ch_dmtrain_json:
      type: file
      description: |
        Channel containing the trained DM model JSON file generated by the training step.
        Structure: `[ val(sample_id), val(meta), path(histone), val(meta2), path(meth), val(state), path(yaml), path(traincounts), path(trainregions), path(traincountsmeth), path("final*.json") ]`
      pattern: "final*.json"
authors:
  - "@aaryanjaitly"
maintainers:
  - "@aaryanjaitly"
