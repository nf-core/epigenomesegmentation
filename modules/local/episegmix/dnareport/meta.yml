# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "episegmix_dnareport"
description: Generates visual reports and plots based on the EpiSegMix DNA methylation segmentation results and the trained hidden Markov model.
keywords:
  - epigenomics
  - dna methylation
  - segmentation
  - hidden markov model
  - report
  - visualization
  - plotting
tools:
  - "episegmix":
      description: "EpiSegMix is a tool for the segmentation of epigenomic data."
      homepage: "https://gitlab.com/rahmannlab/episegmix"
      documentation: "https://gitlab.com/rahmannlab/episegmix/-/blob/main/README.md?ref_type=heads"
      tool_dev_url: ""
      doi: "https://doi.org/10.1093/nar/gkag591"
      licence: null
      identifier: biotools:episegmix

input:
  - - sample_id:
        type: string
        description: Identifier combining sample tissue, time point, and/or state (e.g., `kidney_P0_3`).
    - meta:
        type: map
        description: Groovy Map containing sample information for histone marks.
    - histone:
        type: file
        description: Counts file for histones derived from BAM files.
        pattern: "*.{tab,txt,tsv,bed}"
    - meta2:
        type: map
        description: Groovy Map containing metadata for methylation (WGBS) data.
    - meth:
        type: file
        description: Methylation count matrix file.
    - state:
        type: integer
        description: Integer value representing the number of segments/states to run.
    - yaml:
        type: file
        description: The generated EpiSegMix configuration YAML file.
        pattern: "*.yaml"
    - traincounts:
        type: file
        description: Counts data filtered by the specified training chromosomes.
        pattern: "*train-counts.txt"
    - trainregions:
        type: file
        description: Genomic regions file specifying the length and locations of regions used for training.
        pattern: "*train-regions.txt"
    - traincountsmeth:
        type: file
        description: Methylation counts data used for training.
        pattern: "*train-counts-meth.txt"
    - json:
        type: file
        description: The trained EpiSegMix DNA model JSON file.
        pattern: "final*.json"
    - segmentation:
        type: directory
        description: The directory containing the output files from the decoding step.

output:
  Segmentation:
    - - sample_id:
          type: string
          description: Identifier combining sample tissue, time point, and/or state.
      - meta:
          type: map
          description: Groovy Map containing sample information for histone marks.
      - histone:
          type: file
          description: Counts file for histones.
      - meta2:
          type: map
          description: Groovy Map containing metadata for methylation (WGBS) data.
      - meth:
          type: file
          description: Methylation count matrix file.
      - state:
          type: integer
          description: Integer value representing the number of segments/states to run.
      - yaml:
          type: file
          description: The generated EpiSegMix configuration YAML file.
      - traincounts:
          type: file
          description: Counts data filtered by the specified training chromosomes.
      - trainregions:
          type: file
          description: Genomic regions file specifying the length and locations of regions used for training.
      - traincountsmeth:
          type: file
          description: Methylation counts data used for training.
      - json:
          type: file
          description: The trained EpiSegMix DNA model JSON file.
      - segmentation:
          type: directory
          description: The directory containing the decoded genomic segmentation results.
      - "Plots/*":
          type: file
          description: Generated visual reports and plots evaluating the DNA methylation segmentation.
          pattern: "Plots/*"

  versions_episegmix:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "episegmix":
          type: string
          description: The name of the tool
      - "episegmix --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - episegmix:
          type: string
          description: The name of the tool
      - episegmix --version:
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@aaryanjaitly"
maintainers:
  - "@aaryanjaitly"
