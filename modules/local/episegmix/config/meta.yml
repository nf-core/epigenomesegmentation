# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "episegmix_config"
description: Generates a configuration YAML file for EpiSegMix based on sample metadata, histone counts, and methylation matrices.
keywords:
  - epigenomics
  - segmentation
  - hidden markov model
  - configuration
  - yaml
tools:
  - "episegmix":
      description: "EpiSegMix is a tool for the segmentation of epigenomic data."
      homepage: "https://gitlab.com/rahmannlab/episegmix"
      documentation: "https://gitlab.com/rahmannlab/episegmix/-/blob/main/README.md?ref_type=heads"
      tool_dev_url: ""
      doi: "https://doi.org/10.1093/nar/gkag591"
      licence: null
      identifier: biotools:episegmix

input:
  - - sample_id:
        type: string
        description: Identifier combining sample tissue, time point, and/or state (e.g., `kidney_P0_3`).
    - meta:
        type: map
        description: |
          Groovy Map (or list of maps) containing sample information for histone marks.
          Includes id, replicate, epigenetic_mark, modality, paired_end, and distribution.
          e.g., `[id: 'kidney_P0', replicate: 1, epigenetic_mark: 'H3K4me3', modality: 'ChIP-seq', paired_end: false, distribution: 'NBI']`
    - histone:
        type: file
        description: Counts file for histones derived from BAM files.
        pattern: "*.{tab,txt,tsv,bed}"
    - meta2:
        type: map
        description: |
          Groovy Map containing metadata for methylation (WGBS) data.
          e.g., `[id: 'no_bed_counts']` when handling empty/non-WGBS channels.
    - meth:
        type: file
        description: Methylation count matrix file. Will be empty if no WGBS data is present.
    - state:
        type: integer
        description: Integer value representing the number of segments/states to run.

output:
  yaml:
    - - sample_id:
          type: string
          description: Identifier combining sample tissue, time point, and/or state.
      - meta:
          type: map
          description: Groovy Map containing sample information for histone marks.
      - histone:
          type: file
          description: Counts file for histones.
      - meta2:
          type: map
          description: Groovy Map containing metadata for methylation (WGBS) data.
      - meth:
          type: file
          description: Methylation count matrix file.
      - state:
          type: integer
          description: Integer value representing the number of segments/states to run.
      - "*.yaml":
          type: file
          description: The generated EpiSegMix configuration YAML file.
          pattern: "*.yaml"
  versions_episegmix:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "episegmix":
          type: string
          description: The name of the tool
      - "episegmix --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - episegmix:
          type: string
          description: The name of the tool
      - episegmix --version:
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@aaryanjaitly"
maintainers:
  - "@aaryanjaitly"
