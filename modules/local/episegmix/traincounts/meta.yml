# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "episegmix_traincounts"
description: Extracts count data and defines genomic regions for EpiSegMix model training based on the configuration file.
keywords:
  - epigenomics
  - segmentation
  - hidden markov model
  - counts
  - training
tools:
  - "episegmix":
      description: "EpiSegMix is a tool for the segmentation of epigenomic data."
      homepage: "https://gitlab.com/rahmannlab/episegmix"
      documentation: "https://gitlab.com/rahmannlab/episegmix/-/blob/main/README.md?ref_type=heads"
      tool_dev_url: ""
      doi: "https://doi.org/10.1093/nar/gkag591"
      licence: null
      identifier: biotools:episegmix

input:
  - - sample_id:
        type: string
        description: Identifier combining sample tissue, time point, and/or state (e.g., `kidney_P0_3`).
    - meta:
        type: map
        description: Groovy Map containing sample information for histone marks.
    - histone:
        type: file
        description: Counts file for histones derived from BAM files. Will be empty for DNA-only models.
        pattern: "*.{tab,txt,tsv,bed}"
    - meta2:
        type: map
        description: Groovy Map containing metadata for methylation (WGBS) data.
    - meth:
        type: file
        description: Methylation count matrix file. Will be empty if no WGBS data is present.
    - state:
        type: integer
        description: Integer value representing the number of segments/states to run.
    - yaml:
        type: file
        description: The generated EpiSegMix configuration YAML file from the previous module.
        pattern: "*.yaml"

output:
  train_counts:
    - - sample_id:
          type: string
          description: Identifier combining sample tissue, time point, and/or state.
      - meta:
          type: map
          description: Groovy Map containing sample information for histone marks.
      - histone:
          type: file
          description: Counts file for histones.
      - meta2:
          type: map
          description: Groovy Map containing metadata for methylation (WGBS) data.
      - meth:
          type: file
          description: Methylation count matrix file.
      - state:
          type: integer
          description: Integer value representing the number of segments/states to run.
      - yaml:
          type: file
          description: The generated EpiSegMix configuration YAML file.
      - "*train-counts.txt":
          type: file
          description: Counts data filtered by the specified training chromosomes from the config file. Holds methylation counts if it is a DNA-only model.
          pattern: "*train-counts.txt"
      - "*train-regions.txt":
          type: file
          description: Genomic regions file specifying the length and locations of regions used for training.
          pattern: "*train-regions.txt"
      - "*train-counts-meth.txt":
          type: file
          description: Methylation counts data used for training on the specified chromosomes. This will be an empty dummy file for DNA-only models.
          pattern: "*train-counts-meth.txt"

  dna_regions:
    - - sample_id:
          type: string
          description: Identifier combining sample tissue, time point, and/or state.
      - "*.regions.txt":
          type: file
          description: Genomic regions file specific to the DNA-only model. This will be an empty dummy file for histone models.
          pattern: "*.regions.txt"

  versions_episegmix:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "episegmix":
          type: string
          description: The name of the tool
      - "episegmix --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - episegmix:
          type: string
          description: The name of the tool
      - episegmix --version:
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@aaryanjaitly"
maintainers:
  - "@aaryanjaitly"
